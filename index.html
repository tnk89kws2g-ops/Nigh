<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf8ec">
  <link rel="manifest" href="manifest.json">
  <title>Easypay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="top-fade" aria-hidden="true"></div>

    <main class="screen" id="screen">
      <!-- Balance card -->
      <section class="card balance-card">
        <p class="label">Total balance</p>
        <h1 class="balance" id="balance" aria-live="polite">$112<span class="cents">.00</span></h1>
        <button class="account" id="accountToggle" type="button" aria-label="Show or hide account number">
          <span>Account:</span>
          <span class="account-num" id="accountNum">•••••••••</span>
          <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>

        <div class="actions">
          <button class="btn btn-dark" type="button" data-action="add">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add money
          </button>
          <button class="btn btn-light" type="button" data-action="withdraw">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Withdraw
          </button>
        </div>

        <button class="paychecks" type="button" data-action="paychecks">
          <svg class="pc-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="8 12.5 11 15.5 16 9"/></svg>
          <span class="pc-text">
            <strong>Paychecks</strong>
            <small>Ready for faster paycheck deposits</small>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
        </button>
      </section>

      <!-- Saving -->
      <button class="card row" type="button" data-action="saving">
        <span class="row-icon">
          <svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="9" y="26" width="26" height="14" rx="4" fill="#F5B731" stroke="#3a2a12" stroke-width="2.5"/>
            <circle cx="30" cy="30" r="10" fill="#F5B731" stroke="#3a2a12" stroke-width="2.5"/>
            <text x="30" y="35" text-anchor="middle" font-size="13" font-weight="800" fill="#3a2a12" font-family="Inter, sans-serif">$</text>
            <path d="M14 20l5-7 5 7h-3v6h-4v-6z" fill="#3FBF6B" stroke="#3a2a12" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="row-text">
          <strong>Saving</strong>
          <small>Earn up to 5.76% interest on your savings.</small>
        </span>
        <span class="row-amount" id="savingAmt">$10.00</span>
      </button>

      <!-- Pools -->
      <button class="card row" type="button" data-action="pools">
        <span class="row-icon">
          <svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true">
            <ellipse cx="17" cy="30" rx="11" ry="7" fill="#F5B731" stroke="#3a2a12" stroke-width="2.5" transform="rotate(-20 17 30)"/>
            <ellipse cx="30" cy="22" rx="11" ry="7" fill="#F5B731" stroke="#3a2a12" stroke-width="2.5" transform="rotate(20 30 22)"/>
            <path d="M24 22l5 3" stroke="#3a2a12" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="row-text">
          <strong>Pools</strong>
          <small>1 pool closed successfully today.</small>
        </span>
        <span class="row-amount" id="poolsAmt">$10.00</span>
      </button>

      <h2 class="section-title">More for you</h2>
      <div class="more">
        <div class="more-card"><strong>Invite friends</strong><small>Earn $5 for each friend who joins.</small></div>
        <div class="more-card"><strong>Round-ups</strong><small>Save spare change on every payment.</small></div>
      </div>
    </main>

    <nav class="tabbar" aria-label="Main">
      <button class="tab active" type="button" data-tab="home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6 3 10v10a1 1 0 0 0 1 1h5v-6h6v6h5a1 1 0 0 0 1-1V10z"/></svg>
        <span>Home</span>
      </button>
      <button class="tab" type="button" data-tab="payment">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M14.5 9.2c-.4-.8-1.3-1.2-2.5-1.2-1.5 0-2.4.7-2.4 1.8 0 2.6 5 1.2 5 3.9 0 1.1-1 1.8-2.6 1.8-1.2 0-2.2-.4-2.7-1.3M12 6.5V8m0 8v1.5"/></svg>
        <span>Payment</span>
      </button>
      <button class="tab" type="button" data-tab="activity">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6.5 12 12 15.5 14"/></svg>
        <span>Activity</span>
      </button>
    </nav>

    <div class="toast" id="toast" role="status"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
